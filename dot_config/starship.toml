"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "catppuccin_mocha"

format = """
$os\
$sudo\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$golang\
$gradle\
$java\
$kotlin\
$lua\
$python\
$rust\
$docker_context\
$kubernetes\
$terraform\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "fg:subtext0"

[os.symbols]
Alpine = ""
Amazon = ""
AlmaLinux = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = ""
FreeBSD = ""
Macos = ""
NetBSD = ""
NixOS = ""
OpenBSD = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Ubuntu = ""
Windows = ""

[sudo]
disabled = false
format = "[ $symbol]($style)"
style = "fg:red"
symbol = ""

[username]
format = "[  $user]($style)"
show_always = true
style_user = "fg:blue"
style_root = "bold fg:red"

[hostname]
format = "[ 󰌢 $hostname]($style)"
ssh_only = true
style = "fg:pink"

[directory]
format = "[  $path]($style)"
read_only = " 󰌾 "
style = "fg:teal"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = "[ $symbol $branch]($style)"
symbol = ""
style = "fg:blue"

[git_status]
format = "( \\[($ahead_behind$staged$modified$untracked$renamed$deleted$conflicted)\\])"
ahead = "[⇡${count}](bold cyan)"
behind = "[⇣${count}](bold cyan)"
diverged = "[⇡${ahead_count}⇣${behind_count}](bold cyan)"
staged = "[+${count}](bold green)"
modified = "[●${count}](bold yellow)"
untracked = "[?${count}](bold white)"
renamed = "[»${count}](bold white)"
deleted = "[✘${count}](bold red)"
conflicted = "[${count}](bold red)"

[golang]
format = "[ via $symbol ($version)]($style)"
style = "fg:teal"
symbol = ""

[gradle]
format = "[ via $symbol ($version)]($style)"
style = "fg:teal"
symbol = ""

[java]
format = "[ via $symbol ($version)]($style)"
style = "fg:teal"
symbol = " "

[kotlin]
format = "[ via $symbol ($version)]($style)"
style = "fg:teal"
symbol = " "

[lua]
format = "[ via $symbol ($version)]($style)"
style = "fg:teal"
symbol = " "

[python]
format = "[ via $symbol (${version})($virtualenv)]($style)"
style = "fg:teal"
symbol = ""

[rust]
format = "[ via $symbol ($version)]($style)"
style = "fg:teal"
symbol = "🦀"

[docker_context]
format = "[ via $symbol ($context)]($style)"
only_with_files = true
style = "fg:blue"
symbol = "🐳"

[kubernetes]
disabled = false
format = "[ via $symbol ($context)($namespace)]($style)"
style = "fg:blue"
symbol ="󱃾"

[terraform]
format = "[ via $symbol ($version)($workspace)]($style)"
style = "fg:blue"
symbol = ""

[cmd_duration]
disabled = false
format = "[  $duration](fg:teal)"
min_time = 2_000
min_time_to_notify = 300_000
show_milliseconds = false
show_notifications = false

[character]
disabled = false
success_symbol = "[❯](bold fg:text)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:text)"
vimcmd_replace_one_symbol = "[❮](bold fg:blue)"
vimcmd_replace_symbol = "[❮](bold fg:lavender)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"