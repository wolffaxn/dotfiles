# ~/.config/starship.toml

add_newline = true

palette = "catppuccin_mocha"

format = """
$os\
$username\
$hostname\
$directory\
$golang\
$java\
$kotlin\
$lua\
$python\
$rust\
$docker_context\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold text)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

[cmd_duration]
format = "[$duration ]($style)"
style = "overlay1"

[directory]
format = "[$path]($style)"
read_only = " 󰌾 "
style = "bold blue"
truncation_length = 3

[docker_context]
format = " via [$symbol $context]($style)"
only_with_files = true
style = "sky"
symbol = "🐳"

[fill]
symbol = " "

[git_branch]
format = " on [$symbol$branch]($style)"
symbol = ""
style = "bold teal"

[git_status]
format = '([\[$all_status$ahead_behind$stashed\]]($style)) '
style = "bold yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "✘"
untracked = "?"
modified  = "!"
staged    = "+"
renamed   = "»"
deleted   = ""
stashed   = " 󰋻 "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold maroon"

[hostname]
ssh_only = true
ssh_symbol = " "

[golang]
detect_extensions = ["go"]
detect_files = ["go.mod"]
format = " [$symbol ${version}]($style)"
style = "text"
symbol = ""

[java]
detect_extensions = ["java"]
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts"]
format = " via [$symbol ${version}]($style)"
style = "text"
symbol = "☕"

[kotlin]
detect_extensions = ["kt", "kts"]
detect_files = ["build.gradle.kts", "settings.gradle.kts"]
format = " via [$symbol ${version}]($style)"
style = "text"
symbol = " "

[lua]
format = " via [$symbol($version )]($style)"
style = "text"
symbol = " "

[python]
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "Pipfile", "tox.ini"]
format = " via [$symbol (${version})($virtualenv)]($style)"
style = "text"
symbol = ""

[rust]
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]
format = " via [$symbol ${version}]($style)"
style = "text"
symbol = "🦀"

[os]
disabled = false
style = "subtext0"

[os.symbols]
AlmaLinux = " "
Arch = "󰣇 "
Debian = " "
FreeBSD = " "
Macos = " "
NetBSD = " "
NixOS = " "
OpenBSD = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Ubuntu = " "
Windows = " "

[username]
show_always = true
style_user = "subtext1"
style_root = "bold red"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
