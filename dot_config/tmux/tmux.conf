#
# server options
#

# enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# zero-out escape time delay
set -g escape-time 0
# enable focus events
set -g focus-events on
# use system clipboard
set -g set-clipboard on

#
# session options
#

set -g default-shell "$SHELL"

# start window and pane numbering at 1
set -g base-index 1
# don't exit from tmux when closing a session
set -g detach-on-destroy off
# increase history size for panes
set -g history-limit 50000
# renumber all windows when any window is closed
set -g renumber-windows on
# update the status bar every n seconds
set -g status-interval 5
# show status line on 'bottom' or 'top'
set -g status-position bottom
# display a message instead of sending a bell when activity occur
set -g visual-activity on
# visibility durations for messages and pane IDs
set -g display-time 2000
set -g display-panes-time 2000

#
# window options
#

# aggressively resize the chosen window
setw -g aggressive-resize on
# activity monitoring
setw -g monitor-activity off
# set the starting index for pane numbers
setw -g pane-base-index 1
# visual pane styling
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33

#
# other
#

# enable mouse support (tmux 2.1 and above)
setw -g mouse on

# macOS clipboard integration
if-shell '[ "$(uname -s)" = "Darwin" ]' \
    "set -g copy-command 'pbcopy'"

#
# key bindings
#

# unbind the default tmux prefix Ctrl+b
unbind C-b
# use Ctrl+a as our tmux prefix
set -g prefix C-a
bind C-a send-prefix

# use vim keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# additional vim navigation in copy mode
bind -T copy-mode-vi g send -X goto-line
bind -T copy-mode-vi G send -X bottom-line
bind -T copy-mode-vi / send -X search-forward
bind -T copy-mode-vi ? send -X search-backward

# escape turns on copy mode
bind Escape copy-mode

# reload config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; \
    set-option status-right "#[fg=#{@catppuccin-green}]Config reloaded!" \; \
    run-shell "sleep 2" \; \
    set-option status-right ""

# make prefix p paste the buffer.
unbind p
bind p paste-buffer

# pane switching with awareness of nvim splits
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

# pane resizing with awareness of nvim splits
bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 5"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 5"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 5"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 5"

bind -T copy-mode-vi "C-h" select-pane -L
bind -T copy-mode-vi "C-j" select-pane -D
bind -T copy-mode-vi "C-k" select-pane -U
bind -T copy-mode-vi "C-l" select-pane -R

# shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# split window
unbind %
unbind '"'
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"

# swapping windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# rename window
bind R command-prompt 'rename-window "%%"'

# new window
bind c new-window -c "#{pane_current_path}"

# bind clearing the screen
bind L send-keys "^L"

# kill pane or window with confirmation
bind x kill-pane
bind X kill-window

# session management
bind d detach-client
bind s choose-session
bind n command-prompt -p "New Session:" "new-session -s %%"

#
# plugins
#

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# resurrect
set -g @resurrect-capture-pane-contents "on"
# continuum
set -g @continuum-restore "off"

