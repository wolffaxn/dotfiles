# status bar
set -g status-position bottom
set -g status-left-length 100
set -g status-style "bg=#{@catppuccin-base}, fg=#{@catppuccin-overlay1}"
# status left: session info
set -g status-left "#[fg=#{@catppuccin-text},bold]  #S#[bg=#{@catppuccin-base}]"
# status right: empty
set -g status-right ""
# window list
setw -g window-status-current-format "#[bg=#{@catppuccin-base}, fg=#{@catppuccin-text},bold] #{window_index}:#{window_name}#{?window_zoomed_flag, 󰍋 ,}"
setw -g window-status-format "#[bg=#{@catppuccin-base}, fg=#{@catppuccin-overlay1}] #{window_index}:#{window_name}"
# messages
set -g message-style "bg=#{@catppuccin-base},fg=#{@catppuccin-green},bold"
set -g message-command-style "bg=#{@catppuccin-base},fg=#{@catppuccin-overlay1}"
# mode (copy) styling
setw -g mode-style "bg=#{@catppuccin-base},fg=#{@catppuccin-overlay1}"

# hint: the space between } and { characters is required ensure tpm is installed before attempting to run it
if-shell '[ "$(uname -s)" = "Darwin" ]' {
    run "/opt/homebrew/opt/tpm/share/tpm/tpm"
} {
    run "~/.config/tmux/plugins/tpm/tpm"
}
